name: Build Sanjaykumar Electrical APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Generate Android app project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/sanjaykumar/electrical app/src/main/assets
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "SanjaykumarElectrical"
          include(":app")
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.sanjaykumar.electrical'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.sanjaykumar.electrical'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '2.0'
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:theme="@android:style/Theme.Material.Light.NoActionBar" android:label="Sanjaykumar Electrical 2.0" android:usesCleartextTraffic="false">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/sanjaykumar/electrical/MainActivity.java <<'EOF'
          package com.sanjaykumar.electrical;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.JavascriptInterface;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;
          import android.widget.Toast;
          public class MainActivity extends Activity {
            WebView web;
            SharedPreferences prefs;
            @Override public void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().setStatusBarColor(Color.rgb(10,31,68));
              getWindow().setNavigationBarColor(Color.rgb(10,31,68));
              prefs=getSharedPreferences("skdata",0);
              web=new WebView(this); web.setBackgroundColor(Color.rgb(245,247,250));
              web.getSettings().setJavaScriptEnabled(true); web.getSettings().setDomStorageEnabled(true);
              web.addJavascriptInterface(new Bridge(),"AndroidStore");
              web.setWebViewClient(new WebViewClient());
              setContentView(web,new FrameLayout.LayoutParams(-1,-1));
              web.loadUrl("file:///android_asset/index.html");
            }
            class Bridge {
              @JavascriptInterface public String load(){ return prefs.getString("data","{}"); }
              @JavascriptInterface public void save(String s){ prefs.edit().putString("data",s).apply(); }
              @JavascriptInterface public void toast(String s){ runOnUiThread(()->Toast.makeText(MainActivity.this,s,Toast.LENGTH_SHORT).show()); }
            }
            @Override public void onBackPressed(){ if(web.canGoBack()) web.goBack(); else super.onBackPressed(); }
          }
          EOF
          cat > app/src/main/assets/index.html <<'EOF'
          <!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><style>
          *{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#0d1321;font:15px Arial,sans-serif}.top{background:#0a1f44;color:white;padding:22px 18px 18px;border-radius:0 0 22px 22px}.top small{color:#9fb6d8}.top h2{margin:7px 0}.tabs{display:flex;overflow:auto;gap:8px;padding:12px}.tabs button,.action{border:0;border-radius:12px;padding:11px 14px;background:#e4ebf5;color:#0a1f44;font-weight:bold;white-space:nowrap}.tabs button.active,.primary{background:#ff6b00;color:white}.wrap{padding:0 14px 24px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:white;border-radius:15px;padding:15px;box-shadow:0 2px 10px #1020400c;margin-bottom:10px}.muted{color:#68758a;font-size:12px}.num{font-size:24px;font-weight:bold;margin-top:7px}.section{font-weight:bold;margin:14px 0 10px}.field{width:100%;padding:12px;border:1px solid #d8e0eb;border-radius:10px;margin:5px 0 10px;background:white}.row{display:flex;gap:8px}.row>*{flex:1}button{cursor:pointer}.item{border-bottom:1px solid #edf0f5;padding:10px 0}.danger{background:#ffe8df;color:#b43b00}.hide{display:none}h3{margin:4px 0 12px}
          </style></head><body><div class="top"><small>SANJAYKUMAR ELECTRICAL · BRANCH 2</small><h2>Electrical OS 2.0</h2><div>Repairs • Sales • Stock • Accounts</div></div>
          <div class="tabs"><button class="active" onclick="tab('home',this)">Dashboard</button><button onclick="tab('stock',this)">Inventory</button><button onclick="tab('repair',this)">Repairs</button><button onclick="tab('sale',this)">Sales</button><button onclick="tab('expense',this)">Expenses</button><button onclick="tab('reports',this)">Reports</button></div><main class="wrap">
          <section id="home"><div class="cards"><div class="card"><div class="muted">Today's sales</div><div class="num" id="today">₹0</div></div><div class="card"><div class="muted">Open repairs</div><div class="num" id="open">0</div></div><div class="card"><div class="muted">Stock items</div><div class="num" id="count">0</div></div><div class="card"><div class="muted">This month's expenses</div><div class="num" id="month">₹0</div></div></div><div class="card"><b>Branch 2 focus</b><p class="muted">Repair-first operations. Record every job, sale, purchase and expense to understand real profit.</p></div><div class="section">Recent activity</div><div class="card" id="recent">No activity yet.</div></section>
          <section id="stock" class="hide"><h3>Inventory</h3><div class="card"><input id="pname" class="field" placeholder="Product name"><div class="row"><input id="qty" class="field" type="number" placeholder="Quantity"><input id="cost" class="field" type="number" placeholder="Purchase ₹"></div><input id="price" class="field" type="number" placeholder="Selling price ₹"><button class="action primary" onclick="addProduct()">Add product</button></div><div class="card" id="products"></div></section>
          <section id="repair" class="hide"><h3>Repair job register</h3><div class="card"><input id="customer" class="field" placeholder="Customer name"><input id="phone" class="field" placeholder="Phone number" type="tel"><input id="appliance" class="field" placeholder="Appliance / item"><input id="problem" class="field" placeholder="Complaint / issue"><div class="row"><input id="charge" class="field" type="number" placeholder="Estimated charge ₹"><input id="parts" class="field" type="number" placeholder="Parts cost ₹"></div><button class="action primary" onclick="addRepair()">Save repair job</button></div><div class="card" id="jobs"></div></section>
          <section id="sale" class="hide"><h3>Record sale</h3><div class="card"><input id="saleName" class="field" placeholder="Product / service sold"><div class="row"><input id="saleQty" class="field" type="number" value="1" placeholder="Qty"><input id="saleAmount" class="field" type="number" placeholder="Total amount ₹"></div><input id="saleCustomer" class="field" placeholder="Customer (optional)"><button class="action primary" onclick="addSale()">Save sale</button></div><div class="card" id="sales"></div></section>
          <section id="expense" class="hide"><h3>Daily expenses</h3><div class="card"><input id="expenseName" class="field" placeholder="Expense description"><input id="expenseAmount" class="field" type="number" placeholder="Amount ₹"><button class="action primary" onclick="addExpense()">Save expense</button></div><div class="card" id="expenses"></div></section>
          <section id="reports" class="hide"><h3>Business report</h3><div class="cards"><div class="card"><div class="muted">Total sales</div><div class="num" id="rsales">₹0</div></div><div class="card"><div class="muted">Total expenses</div><div class="num" id="rexp">₹0</div></div><div class="card"><div class="muted">Repair revenue</div><div class="num" id="rrepair">₹0</div></div><div class="card"><div class="muted">Estimated net</div><div class="num" id="rnet">₹0</div></div></div><div class="card muted">Estimated operating result = recorded sales + repair charges − recorded expenses − repair parts costs. This is an operational tracker, not statutory/GST accounting.</div><button class="action" onclick="backup()">Export backup</button><input type="file" class="field" accept="application/json" onchange="restore(event)"></section></main>
          <script>
          const empty={products:[],jobs:[],sales:[],expenses:[]};let d;try{d=JSON.parse(AndroidStore.load());}catch(e){d=empty}d={...empty,...d};
          const save=()=>{AndroidStore.save(JSON.stringify(d));render()};const val=id=>document.getElementById(id).value.trim();const n=id=>Number(val(id)||0);const money=x=>'₹'+Number(x||0).toLocaleString('en-IN');function tab(id,b){document.querySelectorAll('main section').forEach(x=>x.classList.add('hide'));document.getElementById(id).classList.remove('hide');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}
          function addProduct(){if(!val('pname'))return;d.products.push({name:val('pname'),qty:n('qty'),cost:n('cost'),price:n('price')});['pname','qty','cost','price'].forEach(x=>document.getElementById(x).value='');save()}
          function addRepair(){if(!val('customer')||!val('appliance'))return;d.jobs.unshift({customer:val('customer'),phone:val('phone'),item:val('appliance'),problem:val('problem'),charge:n('charge'),parts:n('parts'),status:'Received',date:new Date().toISOString()});['customer','phone','appliance','problem','charge','parts'].forEach(x=>document.getElementById(x).value='');save()}
          function addSale(){if(!val('saleName')||!n('saleAmount'))return;d.sales.unshift({name:val('saleName'),qty:n('saleQty'),amount:n('saleAmount'),customer:val('saleCustomer'),date:new Date().toISOString()});['saleName','saleAmount','saleCustomer'].forEach(x=>document.getElementById(x).value='');save()}
          function addExpense(){if(!val('expenseName')||!n('expenseAmount'))return;d.expenses.unshift({name:val('expenseName'),amount:n('expenseAmount'),date:new Date().toISOString()});['expenseName','expenseAmount'].forEach(x=>document.getElementById(x).value='');save()}
          function status(i,s){d.jobs[i].status=s;save()}function removeItem(type,i){if(confirm('Delete this record?')){d[type].splice(i,1);save()}}
          function render(){let today=new Date().toDateString();document.getElementById('today').textContent=money(d.sales.filter(x=>new Date(x.date).toDateString()===today).reduce((a,x)=>a+x.amount,0));document.getElementById('open').textContent=d.jobs.filter(x=>!['Delivered','Cancelled'].includes(x.status)).length;document.getElementById('count').textContent=d.products.length;document.getElementById('month').textContent=money(d.expenses.filter(x=>new Date(x.date).getMonth()===new Date().getMonth()).reduce((a,x)=>a+x.amount,0));document.getElementById('products').innerHTML=d.products.map((x,i)=>'<div class="item"><b>'+esc(x.name)+'</b><br><span class="muted">Qty '+x.qty+' · Cost '+money(x.cost)+' · Sell '+money(x.price)+'</span> <button onclick="removeItem(\'products\','+i+')">×</button></div>').join('')||'No products';document.getElementById('jobs').innerHTML=d.jobs.map((x,i)=>'<div class="item"><b>'+esc(x.item)+'</b> — '+esc(x.customer)+'<br><span class="muted">'+esc(x.phone)+' · '+esc(x.problem)+' · Charge '+money(x.charge)+'</span><br><select onchange="status('+i+',this.value)">'+['Received','Inspection','Estimate sent','Approved','Repairing','Ready','Delivered','Cancelled'].map(s=>'<option '+(s===x.status?'selected':'')+'>'+s+'</option>').join('')+'</select> <button onclick="removeItem(\'jobs\','+i+')">×</button></div>').join('')||'No repair jobs';document.getElementById('sales').innerHTML=d.sales.map((x,i)=>'<div class="item">'+esc(x.name)+' · '+money(x.amount)+' <button onclick="removeItem(\'sales\','+i+')">×</button></div>').join('')||'No sales';document.getElementById('expenses').innerHTML=d.expenses.map((x,i)=>'<div class="item">'+esc(x.name)+' · '+money(x.amount)+' <button onclick="removeItem(\'expenses\','+i+')">×</button></div>').join('')||'No expenses';document.getElementById('recent').innerHTML=[...d.sales.slice(0,3).map(x=>'Sale · '+esc(x.name)+' · '+money(x.amount)),...d.jobs.slice(0,3).map(x=>'Repair · '+esc(x.item)+' · '+x.status)].slice(0,5).join('<br>')||'No activity yet';let s=d.sales.reduce((a,x)=>a+x.amount,0),e=d.expenses.reduce((a,x)=>a+x.amount,0),r=d.jobs.filter(x=>x.status!=='Cancelled').reduce((a,x)=>a+x.charge,0),p=d.jobs.filter(x=>x.status!=='Cancelled').reduce((a,x)=>a+x.parts,0);document.getElementById('rsales').textContent=money(s);document.getElementById('rexp').textContent=money(e);document.getElementById('rrepair').textContent=money(r);document.getElementById('rnet').textContent=money(s+r-e-p)}
          function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function backup(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.href=u;a.download='sanjaykumar-electrical-backup.json';a.click();URL.revokeObjectURL(u)}function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{d={...empty,...JSON.parse(r.result)};save()}catch(x){alert('Invalid backup')}};r.readAsText(f)}render();
          </script></body></html>
          EOF
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload APK file
        uses: actions/upload-artifact@v4
        with:
          name: Sanjaykumar-Electrical-2.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: Sanjaykumar Electrical 2.0
          make_latest: true
          files: app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
